# ─── UNZANASA platform self-hosted stack ────────────────────────────────────
# Brings up the app together with PostgreSQL. The appdata volume persists
# /app/.data (uploaded past-paper PDFs, mail outbox, file-store fallback)
# across rebuilds; pgdata persists accounts, sync snapshots and site content.
#   docker compose up --build
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://unzanasa:unzanasa@db:5432/unzanasa?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Email (password reset / verification). Without a key, mails land in
      # /app/.data/outbox as files with the action links inside.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # AI keys are optional — the app ships with an offline tutor engine.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - appdata:/app/.data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unzanasa
      POSTGRES_PASSWORD: unzanasa
      POSTGRES_DB: unzanasa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # localhost-only: lets `prisma migrate deploy` run from a checkout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unzanasa"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  appdata:
  pgdata:
